<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Flexbox Mockup</title>
  </head>
  <body>
    <header>
      <nav>
        <ul id="nav-list">
          <li>
            <button class="nav-btn">
              <img src="/imgs/logo.png" alt="logo" />SHOP
            </button>
          </li>
          <li><button class="nav-btn">Our Honey</button></li>
          <li><button class="nav-btn">Trace Honey</button></li>
          <li><button class="nav-btn">Facilities</button></li>
          <li><button class="nav-btn">Contacts</button></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Best Selling Products</h1>
      <section class="card-container">
        <img src="/imgs/honey.jpg" alt="honey-pic" />
        <div class="card-text">
          <span class="text-style"
            >100% Bio Honey<br />Italian, not treated</span
          >
          <span class="text-style">7$/kg</span>
        </div>
        <button class="nav-btn">Add to cart</button>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
